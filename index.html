<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vehicle</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="vehicle">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#eef1f3;--card:#fff;--ink:#1b2530;--mute:#667483;--line:#d6dde2;--ac:#0e6b73;--warn:#c8402a}
@media(prefers-color-scheme:dark){:root{--bg:#12181d;--card:#1b232a;--ink:#e6ebef;--mute:#8d9ba7;--line:#2c3740;--ac:#4fb3bd;--warn:#ef7c66}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--bg);display:flex;gap:10px;align-items:center;padding:10px 14px}
header img{border-radius:9px;display:block}
.sp{flex:1}
.cars{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin-bottom:2px;scrollbar-width:none}
.cars::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 16px;cursor:pointer;line-height:1.3;text-align:left}
.chip small{display:block;font-size:12px;color:var(--mute)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip.on small{color:#ffffffcc}
.chip.off{opacity:.55}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
nav{display:flex;border-bottom:2px solid var(--line);margin-bottom:14px}
nav button{flex:1;background:none;border:0;padding:10px;font:inherit;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:700}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
header button{background:transparent;color:var(--bg);border:1px solid #fff5;border-radius:6px;padding:7px 10px;width:auto;cursor:pointer}
label{display:block;font-size:14px;color:var(--mute);margin-top:10px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:10px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:none;color:var(--warn);border:1px solid var(--warn)}
.fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:28px;font-size:30px;line-height:1;padding:0;box-shadow:0 3px 10px #0004}
.rec{background:var(--card);border-left:4px solid var(--ac);padding:10px 12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.rec small{color:var(--mute);display:block}
.rec .cost{font-weight:700;white-space:nowrap}
.tag{font-size:13px;color:var(--ac);margin-right:6px}
.due{background:var(--card);border-left:4px solid var(--warn);padding:8px 12px;margin-bottom:6px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.bar span:first-child{width:56px;flex:none}
.bar i{display:block;height:14px;background:var(--ac);border-radius:2px}
.box{background:var(--card);padding:12px 14px;margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:16px}
dialog{border:0;border-radius:10px;padding:16px;width:min(94vw,460px);max-height:92vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0007}
.row{display:flex;gap:8px}.row>*{flex:1}
.acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;display:none;z-index:9}
</style>
</head>
<body>
<header><img src="icons/icon-192.png" alt="vehicle" width="36" height="36"><span class="sp"></span><button id="addCar">新增車輛</button><button id="cfgBtn">設定</button></header>
<main>
<div class="cars" id="cars"></div>
<nav id="nav"><button data-t="log" class="on">紀錄</button><button data-t="stat">統計</button><button data-t="car">車輛資料</button></nav>
<div id="view"></div>
</main>
<button class="btn fab" id="fab" aria-label="新增紀錄">+</button>
<div id="toast"></div>

<dialog id="dCfg"><form method="dialog" id="fCfg"><h3>連線設定</h3>
<label>Apps Script 網址<input name="url" required placeholder="https://script.google.com/macros/s/.../exec"></label>
<p style="font-size:13px;color:var(--mute)">網址只存在這台裝置的瀏覽器，不會上傳到 GitHub。手機與電腦各設定一次，請勿外流。</p>
<div class="acts"><button class="btn">儲存</button></div></form></dialog>

<dialog id="dRec"><form method="dialog" id="fRec"><h3 id="tRec">新增紀錄</h3><input type="hidden" name="ID">
<div class="row"><label>日期<input type="date" name="日期" required></label><label>類別<select name="類別" id="cat"></select></label></div>
<label>項目<input name="項目" required placeholder="例如：機油、煞車來令片、加油"></label>
<div class="row"><label>里程 (km)<input type="number" inputmode="numeric" name="里程"></label><label>費用 (元)<input type="number" inputmode="decimal" name="費用"></label></div>
<label id="lLit">公升（加油）<input type="number" step="0.01" inputmode="decimal" name="公升"></label>
<label>店家<input name="店家"></label>
<label>備註<textarea name="備註" rows="2"></textarea></label>
<div class="row"><label>下次里程<input type="number" inputmode="numeric" name="下次里程"></label><label>下次日期<input type="date" name="下次日期"></label></div>
<div class="acts"><button type="button" class="btn del" id="delRec">刪除</button><button type="button" class="btn ghost" data-close>取消</button><button class="btn">儲存</button></div></form></dialog>

<dialog id="dCar"><form method="dialog" id="fCar"><h3>車輛資料</h3>
<label>名稱（同時是分頁名稱，建立後不可改）<input name="名稱" required></label>
<div class="row"><label>車牌<input name="車牌"></label><label>年份<input name="年份" type="number"></label></div>
<div class="row"><label>目前里程<input name="目前里程" type="number"></label><label>狀態<select name="狀態"><option>使用中</option><option>停用</option></select></label></div>
<div class="row"><label>驗車到期<input type="date" name="驗車到期"></label><label>牌照稅到期<input type="date" name="牌照稅到期"></label></div>
<div class="row"><label>強制險到期<input type="date" name="強制險到期"></label><label>任意險到期<input type="date" name="任意險到期"></label></div>
<div class="acts"><button type="button" class="btn ghost" data-close>取消</button><button class="btn">儲存</button></div></form></dialog>

<script>
const $ = s => document.querySelector(s);
const CATS = ['保養','維修','改裝','檢驗','保險','稅金','加油'];
const n$ = x => Number(x || 0).toLocaleString('zh-TW');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cfg = JSON.parse(localStorage.getItem('vehicle-cfg') || '{}'), V = [], R = [], cur = localStorage.getItem('vehicle-cur') || '', tab = 'log';

function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2200); }
async function api(action, p = {}) {
  const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ action, ...p }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j.data;
}
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast('失敗：' + e.message); } };
const fill = (f, o) => [...f.elements].forEach(e => { if (e.name) e.value = o[e.name] ?? ''; });
const renderCars = () => $('#cars').innerHTML = V.map(v => `<button class="chip${v.名稱 === cur ? ' on' : ''}${v.狀態 === '停用' ? ' off' : ''}" data-n="${esc(v.名稱)}">${esc(v.名稱)}${v.車牌 ? `<small>${esc(v.車牌)}</small>` : ''}</button>`).join('');
const vehicle = () => V.find(v => v.名稱 === cur);

const loadAll = guard(async () => {
  if (!cfg.url) { $('#dCfg').showModal(); return; }
  $('#view').innerHTML = '<div class="empty">載入中…</div>';
  V = await api('vehicles');
  if (!vehicle()) cur = (V.find(v => v.狀態 !== '停用') || V[0] || {}).名稱 || '';
  renderCars();
  R = cur ? await api('records', { v: cur }) : [];
  R.sort((a, b) => String(b.日期).localeCompare(String(a.日期)) || b.里程 - a.里程);
  render();
});

function dueList() {
  const v = vehicle(), L = [], d = x => Math.ceil((new Date(x) - Date.now()) / 864e5);
  if (!v) return L;
  ['驗車','強制險','任意險','牌照稅'].forEach(k => { const x = v[k + '到期']; if (x && d(x) <= 30) L.push(`${k}到期 ${x}（${d(x) < 0 ? '已過期 ' + -d(x) : '剩 ' + d(x)} 天）`); });
  const last = {};
  [...R].reverse().forEach(r => last[r.項目] = r);
  Object.values(last).forEach(r => {
    if (r.下次日期 && d(r.下次日期) <= 30) L.push(`${r.項目} 預計 ${r.下次日期}`);
    if (r.下次里程 && r.下次里程 - v.目前里程 <= 1000) L.push(`${r.項目} 預計 ${n$(r.下次里程)} km（目前 ${n$(v.目前里程)}）`);
  });
  return L;
}

function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#fab').style.display = tab === 'log' && cur ? '' : 'none';
  const v = $('#view');
  if (!V.length) { v.innerHTML = '<div class="empty">還沒有車輛，點上方「新增車輛」開始記錄。</div>'; return; }
  if (tab === 'log') {
    v.innerHTML = dueList().map(x => `<div class="due">⚠ ${esc(x)}</div>`).join('') +
      (R.length ? R.map(r => `<div class="rec" data-id="${esc(r.ID)}"><div><span class="tag">${esc(r.類別)}</span>${esc(r.項目)}<small>${esc(r.日期)}${r.里程 ? ' · ' + n$(r.里程) + ' km' : ''}${r.店家 ? ' · ' + esc(r.店家) : ''}</small>${r.備註 ? `<small>${esc(r.備註)}</small>` : ''}</div><div class="cost">$${n$(r.費用)}</div></div>`).join('') : '<div class="empty">這台車還沒有紀錄，點右下角「+」新增。</div>');
  } else if (tab === 'stat') stats(v);
  else {
    const c = vehicle();
    v.innerHTML = `<div class="box"><h3>${esc(c.名稱)} ${esc(c.車牌)}</h3>${['年份','目前里程','狀態','驗車到期','強制險到期','任意險到期','牌照稅到期'].map(k => `<div>${k}：${esc(c[k]) || '—'}</div>`).join('')}<div class="acts"><button class="btn" id="editCar">編輯</button></div></div>`;
  }
}

function bars(o) {
  const m = Math.max(...Object.values(o), 1);
  return Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, x]) => `<div class="bar"><span>${esc(k)}</span><i style="width:${x / m * 60}%"></i><span>$${n$(x)}</span></div>`).join('');
}
function stats(v) {
  if (!R.length) { v.innerHTML = '<div class="empty">有紀錄後才會顯示統計。</div>'; return; }
  const yr = {}, cat = {}; let tot = 0;
  R.forEach(r => { const c = Number(r.費用) || 0; tot += c; yr[String(r.日期).slice(0, 4)] = (yr[String(r.日期).slice(0, 4)] || 0) + c; cat[r.類別] = (cat[r.類別] || 0) + c; });
  const odo = R.map(r => Number(r.里程)).filter(Boolean), km = odo.length ? Math.max(...odo) - Math.min(...odo) : 0;
  const fuel = R.filter(r => r.類別 === '加油' && r.里程 && r.公升).sort((a, b) => a.里程 - b.里程);
  let eco = '—';
  if (fuel.length > 1) eco = ((fuel.at(-1).里程 - fuel[0].里程) / fuel.slice(1).reduce((s, r) => s + Number(r.公升), 0)).toFixed(2) + ' km/L';
  v.innerHTML = `<div class="box"><h3>總覽</h3><div>總花費：$${n$(tot)}</div><div>每公里成本：${km ? '$' + (tot / km).toFixed(2) : '—'}</div><div>平均油耗（以加滿計）：${eco}</div></div><div class="box"><h3>各年度花費</h3>${bars(yr)}</div><div class="box"><h3>各類別花費</h3>${bars(cat)}</div>`;
}

function openRec(r) {
  const f = $('#fRec'), e = !!r;
  r = r || { 日期: new Date().toLocaleDateString('sv'), 類別: '保養', 里程: vehicle()?.目前里程 || '' };
  fill(f, r);
  $('#tRec').textContent = e ? '編輯紀錄' : '新增紀錄';
  $('#delRec').style.display = e ? '' : 'none';
  lit();
  $('#dRec').showModal();
}
const lit = () => $('#lLit').style.display = $('#cat').value === '加油' ? '' : 'none';

// 事件
$('#cat').innerHTML = CATS.map(c => `<option>${c}</option>`).join('');
$('#cat').onchange = lit;
$('#nav').onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; render(); } };
$('#cars').onclick = e => { const c = e.target.closest('.chip'); if (c && c.dataset.n !== cur) { cur = c.dataset.n; localStorage.setItem('vehicle-cur', cur); loadAll(); } };
$('#fab').onclick = () => openRec();
$('#view').onclick = e => {
  const c = e.target.closest('.rec');
  if (c) openRec(R.find(r => r.ID === c.dataset.id));
  if (e.target.id === 'editCar') { fill($('#fCar'), vehicle()); $('#fCar [name=名稱]').readOnly = true; $('#dCar').showModal(); }
};
$('#addCar').onclick = () => { fill($('#fCar'), { 狀態: '使用中' }); $('#fCar [name=名稱]').readOnly = false; $('#dCar').showModal(); };
$('#cfgBtn').onclick = () => { fill($('#fCfg'), cfg); $('#dCfg').showModal(); };
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
$('#fCfg').onsubmit = () => { cfg = Object.fromEntries(new FormData($('#fCfg'))); localStorage.setItem('vehicle-cfg', JSON.stringify(cfg)); loadAll(); };
$('#fRec').onsubmit = guard(async e => {
  e.preventDefault();
  await api('saveRecord', { v: cur, rec: Object.fromEntries(new FormData($('#fRec'))) });
  $('#dRec').close(); toast('已儲存'); await loadAll();
});
$('#delRec').onclick = guard(async () => {
  if (!confirm('確定刪除這筆紀錄？')) return;
  await api('deleteRecord', { v: cur, id: $('#fRec [name=ID]').value });
  $('#dRec').close(); toast('已刪除'); await loadAll();
});
$('#fCar').onsubmit = guard(async e => {
  e.preventDefault();
  const veh = Object.fromEntries(new FormData($('#fCar')));
  await api('saveVehicle', { veh });
  cur = veh.名稱; localStorage.setItem('vehicle-cur', cur);
  $('#dCar').close(); toast('已儲存'); await loadAll();
});
loadAll();
</script>
</body>
</html>
